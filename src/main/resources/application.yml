server:
  port: 9000
spring:
  application:
    name: cards

  datasource:
    url: jdbc:mysql://localhost:3306/cards_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
